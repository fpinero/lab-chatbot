apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: labchatbot
  namespace: labchatbot
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: labchatbot.nivelepsilon.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: labchatbot
                port:
                  number: 80
# Reuse the existing Traefik/Cloudflare routing pattern. No certificate issuer is installed.
