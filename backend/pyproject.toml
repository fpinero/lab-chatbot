[project]
name = "lab-chatbot-backend"
version = "0.1.0"
description = "Private model experimentation workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
  "python-multipart>=0.0.22,<1",
  "pypdf>=6,<8",
  "python-docx>=1.2,<2",
  "pillow>=12,<14",
  "simplejson>=3.20,<4",
  "sqlalchemy>=2.0.46,<2.1",
  "alembic>=1.18,<2",
  "argon2-cffi>=25.1,<26",
  "pyjwt[crypto]>=2.15.1,<3",
  "tzdata>=2026.1",
  "fastapi>=0.135,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.13,<3",
  "uvicorn>=0.41,<1",
]

[dependency-groups]
dev = [
  "types-simplejson>=3.20,<4",
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "ruff>=0.15,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]
